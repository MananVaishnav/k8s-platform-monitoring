apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: task-app
spec:
  limits:
    - type: Container
      defaultRequest: # used when a container doesn't set requests
        cpu: 50m
        memory: 64Mi
      default:  # used when a container doesn't set limits
        cpu: 200m
        memory: 128Mi
      max:  # no single container asks more then this
        cpu: "1"
        memory: 1Gi

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-app-quota
  namespace: task-app
spec:
  hard:  # maximum total resource quantities allowed in the namespace
    pods: "20"
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
